<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
    <title>NASA Facility Weather</title>
  </head>
  <body>
    <header class="hero">
      <div class="container">
        <p class="info">NASA Facilities</p>

        <h1>NASA Facility Weather</h1>
        <p>
          Explore NASA facilities and see the current weather at each location.
        </p>
      </div>
    </header>

    <main class="container">
      <section class="controls">
        <label for="searchInput">Search Facilities</label>
        <input
          type="search"
          id="searchInput"
          placeholder="Search by Facility, center, city, or state..."
        />
      </section>

      <section class="results-header">
        <h2>Facilities</h2>
        <p id="facilityCount">Loading facilities...</p>
      </section>

      <p id="statusMessage" class="status-message">
        Loading NASA facilities...
      </p>

      <section id="facilityContainer" class="facility-grid"></section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>Facility data: NASA Open Data Portal · Weather: Open-Meteo</p>
      </div>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
